<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocialLens 控制台</title>
<script>try { const t = JSON.parse(localStorage.getItem("sl_theme") || '"system"'); if (t !== "system") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="SocialLens"></nav>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="详情"></aside>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" role="status"></div>
<script src="icons.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
