[project]
name = "sociallens"
version = "0.1.0"
description = "Local social media data gateway: browser extension + localhost API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
download = [
    "curl-cffi>=0.7",
    "yt-dlp>=2025.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "playwright>=1.47",
]

[project.scripts]
sociallens = "sociallens.main:run"
sociallens-mcp = "sociallens.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sociallens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
