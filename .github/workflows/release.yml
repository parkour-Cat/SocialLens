name: Release

# Push a tag like v0.2.0 to publish a GitHub Release with the built extension (zip, load
# unpacked) and the backend wheel / sdist. The tag must match the versions in
# backend/sociallens/__init__.py, backend/pyproject.toml and extension/manifest.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/sociallens/__init__.py)
          pyproj=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)
          manifest=$(node -p 'require("./extension/manifest.json").version')
          echo "tag=$tag __init__=$init pyproject=$pyproj manifest=$manifest"
          [ "$tag" = "$init" ] && [ "$tag" = "$pyproj" ] && [ "$tag" = "$manifest" ]

      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Test
        run: |
          (cd backend && uv sync --extra dev --frozen && uv run pytest -q)
          (cd extension && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test)

      - name: Build extension
        working-directory: extension
        run: |
          pnpm build
          cd dist && zip -r "../../sociallens-extension-${GITHUB_REF_NAME}.zip" .

      - name: Build backend
        working-directory: backend
        run: uv build --out-dir ../dist-backend

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "sociallens-extension-${GITHUB_REF_NAME}.zip" dist-backend/* \
            --title "$GITHUB_REF_NAME" --generate-notes
